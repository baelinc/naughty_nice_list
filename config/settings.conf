# Santa's Naughty & Nice List - Configuration
# Copy this file to your plugin directory and edit as needed
# This file is sourced by the shell scripts

# SaaS platform API URL (no trailing slash)
SANTA_API_URL="https://your-saas-site.com"

# API key for authentication (leave blank if not needed)
SANTA_API_KEY=""

# LED Panel configuration
SANTA_PANEL_ROWS=32
SANTA_PANEL_COLS=64
SANTA_CHAIN_LENGTH=1
SANTA_PARALLEL=1

# GPIO slowdown (1-4, increase if you see glitching)
SANTA_GPIO_SLOWDOWN=2
