# Santa's List FPP Plugin - Configuration
# Edit these values after installing the plugin on your Pi.
# This file is sourced by all scripts.

# -----------------------------------------------------------------------
# WordPress site settings
# -----------------------------------------------------------------------

# Full URL to your WordPress site (no trailing slash)
SANTA_WP_URL="https://your-wordpress-site.com"

# API key from WordPress: Santa's List → Settings → FPP API Key
SANTA_API_KEY="your-api-key-here"

# -----------------------------------------------------------------------
# FPP settings
# -----------------------------------------------------------------------

# FPP API base URL (usually localhost)
SANTA_FPP_URL="http://localhost"

# FPP overlay model names (must match names configured in FPP → Channel Outputs → Pixel Overlays)
# Title panel - shows "Santa's Naughty & Nice List"
SANTA_TITLE_OVERLAY="SantaTitle"

# Names panel - scrolls the list of names
SANTA_NAMES_OVERLAY="SantaNames"

# How often (in seconds) to fetch the latest list from WordPress
SANTA_POLL_INTERVAL=120

# -----------------------------------------------------------------------
# Display settings (these are also configurable from WordPress admin)
# but can be overridden here for local testing
# -----------------------------------------------------------------------

# Leave blank to use settings from WordPress (recommended)
# Set a value here to override WordPress settings locally

# SANTA_SCROLL_DIRECTION="up"   # up, down, static
# SANTA_NAMES_PER_SCREEN=5
# SANTA_SCROLL_SPEED=50
